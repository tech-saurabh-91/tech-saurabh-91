<svg xmlns="http://www.w3.org/2000/svg" width="640" height="64" viewBox="0 0 640 64" role="img" aria-label="Currently Exploring" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Currently Exploring</title>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.float{animation:float 4.5s ease-in-out infinite}
.float2{animation:float 5.5s ease-in-out infinite;animation-delay:-1.5s}
.float3{animation:float 4s ease-in-out infinite;animation-delay:-2.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ring{animation:dash 8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-400}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.halo{animation:halo 4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.5}50%{opacity:1}}
.glow{animation:glow 2.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
@keyframes grow{0%{transform:scaleY(.15)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040916"/><stop offset=".55" stop-color="#0a1440"/><stop offset="1" stop-color="#050b22"/></linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5b7cff" opacity=".45"/></pattern>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".2"/></linearGradient></defs>
<rect x="1.5" y="1.5" width="637" height="61" rx="18" fill="#0a1440" fill-opacity=".92" stroke="url(#border)" stroke-width="1.5"/>
<path d="M24,3 H616" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="40" cy="32" r="20" fill="#0ea5e9" fill-opacity=".22" stroke="#38bdf8"/>
<g transform="translate(40,32)" fill="#7dd3fc"><circle cx="0" cy="-3" r="7"/><rect x="-3.5" y="5" width="7" height="4" rx="1"/></g>
<text x="78" y="41" font-size="26" font-weight="700" fill="#ffffff">Currently Exploring</text>
<rect class="glow" x="423" y="31" width="157" height="2" rx="1" fill="url(#ln)"/>
<circle class="glow" cx="600" cy="32" r="4" fill="#22d3ee"/><circle class="glow" cx="614" cy="32" r="3" fill="#8b5cf6" style="animation-delay:.5s"/>
</svg>