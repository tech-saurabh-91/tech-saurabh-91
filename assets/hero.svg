<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Saurabh Singh - Oracle APEX Developer and PL/SQL Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Saurabh Singh - Oracle APEX Developer and PL/SQL Engineer</title>
<style>
