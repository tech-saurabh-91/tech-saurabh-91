.float{animation:float 4.5s ease-in-out infinite}
.float2{animation:float 5.5s ease-in-out infinite;animation-delay:-1.5s}
.float3{animation:float 4s ease-in-out infinite;animation-delay:-2.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ring{animation:dash 8s linear infinite}
