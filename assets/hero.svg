.glow{animation:glow 2.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
@keyframes grow{0%{transform:scaleY(.15)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
</style>
